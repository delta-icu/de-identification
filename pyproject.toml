[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greek-med-anonymizer"
version = "0.1.0"
description = "Configurable anonymization pipeline for Greek medical reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = [
  # transformers 5.x requires torch >= 2.5 and changes the tokenizer config
  # format. Pinned below 5 to match the bundled model.
  "transformers>=4.40.0,<5",
  "torch>=2.2.0",
]
ui = [
  "streamlit>=1.36.0",
  "gdown>=5.2.0",
]

[project.scripts]
greek-med-anonymizer = "greek_med_anonymizer.cli:main"
greek-med-anonymizer-ui = "greek_med_anonymizer.web_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
